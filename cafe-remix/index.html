<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-pop menu</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet"> 
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>K-pop Shop</h1>
        <p class="established">Est. 2026 Fresno CA</p>
        <hr>
        <section>
          <h2>Official Merch</h2>
          <!--<img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>-->
          <article class="item">
            <p class="flavor">Albums</p><p class="price">15.00</p>
          </article>
          <article class="item">
            <p class="flavor">Photo Cards</p><p class="price">5.00</p>
          </article>
          <article class="item">
            <p class="flavor">LightSticks</p><p class="price">60.00</p>
          </article>
          <article class="item">
            <p class="flavor">Posters</p><p class="price">7.00</p>
          </article>
          <article class="item">
            <p class="flavor">Plushies</p><p class="price">10.00+</p>
          </article>
        </section>
        <section>
          <h2>Collectibles</h2>
          <!--<img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>--> 
          <article class="item">
            <p class="dessert">T-Shirts</p><p class="price">8.00</p>
          </article>
          <article class="item">
            <p class="dessert">Sweaters</p><p class="price">12.00</p>
          </article>
          <article class="item">
            <p class="dessert">Banners</p><p class="price">10.00</p>
          </article>
          <article class="item">
            <p class="dessert">Accessories</p><p class="price">3.00+</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <!--<a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>--> 
          </p>
          <p class="address">123 K-pop Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
