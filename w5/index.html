<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWICE Fan Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand custom-brand-title" href="#">TWICE Fan Page</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#members">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="#fanclub">Fan Club</a></li>
        </ul>
      </div>
    </div>
  </nav>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<section id="members" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Featured Members</h2>
      <div class="row g-4">
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Nayeon</h5>
              <p class="card-text">Lead Vocalist, Lead Dancer, and Center of TWICE.</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Jihyo</h5>
              <p class="card-text">Leader and Main Vocalist known for powerful vocals.</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Dahyun</h5>
              <p class="card-text">Lead Rapper and Sub Vocalist loved for her expressiveness.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="fanclub" class="py-5 bg-light">
    <div class="container" style="max-width: 500px;">
      <h2 class="text-center mb-4">Join the ONCE Fan Club</h2>
      <form>
        <div class="mb-3">
          <label for="userName" class="form-label">Preferred Name</label>
          <input type="text" class="form-control" id="userName" placeholder="Enter your name" required>
        </div>
        <div class="mb-3">
          <label for="userEmail" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="userEmail" placeholder="onceforever@twice.com" required>
        </div>
        <div class="mb-3">
          <label for="biasSelect" class="form-label">Favorite Member (Bias)</label>
          <select class="form-select" id="biasSelect">
            <option selected>Choose a member :)</option>
            <option value="nayeon">Nayeon</option>
            <option value="jeongyeon">Jeongyeon</option>
            <option value="momo">Momo</option>
            <option value="sana">Sana</option>
            <option value="jihyo">Jihyo</option>
            <option value="mina">Mina</option>
            <option value="dahyun">Dahyun</option>
            <option value="chaeyoung">Chaeyoung</option>
            <option value="tzuyu">Tzuyu</option>
          </select>
          </div>
      </form>
    </div>
  </section>
</body>
</html>
